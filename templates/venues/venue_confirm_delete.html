{% extends 'base.html' %}

{% block title %}Confirm Delete Venue{% endblock %}

{% block content %}
  <h2>Confirm Delete: {{ venue.name }}</h2>
  <p>Are you sure you want to delete this venue? This action cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
    <a href="{% url 'venues:venue-list' %}">Cancel</a>
  </form>
{% endblock %}
